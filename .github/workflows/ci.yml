name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: for f in install.sh docs/demo/*.sh; do sh -n "$f"; done
      - run: python3 -m py_compile scripts/install.py docs/demo/bin/gh docs/demo/bin/curl
